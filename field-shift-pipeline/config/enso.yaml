# ENSO classification rules.
#
# Every threshold here is CPC's own published definition; nothing is tuned by us.
# Read by pipeline/fetch_enso.py.

episode:
  # A season is warm/cold when the 3-month index is at or beyond +/- this value.
  threshold_c: 0.5
  # ...and it only counts as an El Nino / La Nina episode once that holds for this many
  # consecutive overlapping 3-month seasons.
  min_consecutive_seasons: 5
  # CPC publishes and colours its episode table on values rounded to one decimal, so we
  # classify on the rounded value to reproduce that table exactly.
  round_decimals: 1
  source: >-
    NOAA CPC, ONI v5 and RONI pages: "periods of below and above normal SSTs are colored in blue
    and red when the threshold is met for a minimum of five (5) consecutive overlapping seasons",
    threshold +/- 0.5 C.
    https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/

# Strength categories, lower bounds in deg C of |index|. Same bins CPC uses for its official
# ENSO strength probabilities, which are verified against RONI.
strength:
  weak: 0.5
  moderate: 1.0
  strong: 1.5
  very_strong: 2.0
  source: >-
    NOAA CPC, Official ENSO Strength Probabilities (bins 0.5 / 1.0 / 1.5 / 2.0 C labelled weak,
    moderate, strong, very strong).
    https://cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/strengths/

# "Historic" El Nino: stronger than any since 1950.
historic:
  threshold_c: 2.5
  index: RONI
  source: >-
    NOAA CPC ENSO Diagnostic Discussion, 12 Nov 2026: "a historic event exceeding previous El Ninos
    dating back to 1950 (+2.5 C or more for a 3-month RONI value)".
    https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.shtml
